<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="lib/theme-boot.js"></script>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 368px; background: var(--bg); background-image: var(--glow); }
    .wrap { padding: 16px 16px 14px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; margin-bottom: 12px; }
    .stat { padding: 11px 10px 10px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat b { display: block; font: 500 22px/1.1 var(--mono); letter-spacing: -.02em; margin-top: 6px; }
    .stat.hot b { color: var(--gold-ink); }
    .hero-btn { width: 100%; justify-content: center; padding: 13px; font-size: 14.5px; border-radius: 12px; }
    .actions { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 4px; }
    .action { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; background: transparent; color: var(--text); border-radius: 10px; cursor: pointer; text-align: left; font: inherit; transition: background .2s; }
    .action:hover:not(:disabled) { background: var(--hover); }
    .action:disabled { opacity: .45; cursor: default; }
    .action .tile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); flex: none; }
    .action .t { font-weight: 600; font-size: 13.5px; }
    .action .s { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .save { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px; }
    .save .row input[type=text] { padding: 8px 10px; }
    footer { margin-top: 12px; display: grid; gap: 2px; }
    .tog { display: flex; align-items: center; justify-content: space-between; padding: 7px 4px; font-size: 13px; color: var(--text-2); }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="mark" src="icons/128.png" alt="">
    <div class="grow"><div class="brand"><b>ElevenTabs</b></div><div class="brand"><span class="by">by YourElevens</span></div></div>
    <button class="btn btn-sm" id="open-dash" title="Open dashboard"><i data-icon="layout-dashboard" data-size="15"></i>Dashboard</button>
  </header>

  <div class="stats">
    <div class="stat"><span class="eyebrow">Tabs</span><b id="s-tabs">–</b></div>
    <div class="stat"><span class="eyebrow">Windows</span><b id="s-wins">–</b></div>
    <div class="stat"><span class="eyebrow">Asleep</span><b id="s-sleep">–</b></div>
    <div class="stat" id="dupe-stat"><span class="eyebrow">Dupes</span><b id="s-dupes">–</b></div>
  </div>

  <button class="btn btn-gold hero-btn" id="group"><i data-icon="sparkles" data-size="17"></i>Tidy my tabs</button>

  <div class="actions">
    <button class="action" id="welcome"><span class="tile"><i data-icon="sun" data-size="16"></i></span><span class="grow"><div class="t">Welcome back</div><div class="s">Pick up where you left off</div></span><kbd class="kbd" data-k="W">⌥⇧W</kbd></button>
    <button class="action" id="dupes"><span class="tile"><i data-icon="copy-x" data-size="16"></i></span><span class="grow"><div class="t">Close duplicates</div><div class="s" id="dupes-sub">Keep one copy of each page</div></span><kbd class="kbd" data-k="D">⌥⇧D</kbd></button>
    <button class="action" id="sleep"><span class="tile"><i data-icon="moon" data-size="16"></i></span><span class="grow"><div class="t">Sleep background tabs</div><div class="s">Free memory now · wakes on click</div></span><kbd class="kbd" data-k="S">⌥⇧S</kbd></button>
    <button class="action" id="ungroup"><span class="tile"><i data-icon="undo-2" data-size="16"></i></span><span class="grow"><div class="t">Undo grouping</div><div class="s">Your own groups stay untouched</div></span></button>
  </div>

  <div class="save">
    <div class="row" style="margin-bottom:9px"><i data-icon="save" data-size="15"></i><span class="eyebrow" style="color:var(--text-2)">Save window as a session</span></div>
    <div class="row">
      <input type="text" id="sess-name" placeholder="e.g. Job hunt · Client work" maxlength="60">
      <button class="btn btn-icon" id="save" title="Save session"><i data-icon="check" data-size="16"></i></button>
    </div>
    <label class="check" style="margin-top:9px"><input type="checkbox" id="sess-close">Close the tabs after saving</label>
  </div>

  <footer>
    <div class="tog"><span>Auto-sort new tabs</span><span class="switch"><input type="checkbox" id="t-auto" aria-label="Auto-sort new tabs"></span></div>
    <div class="tog"><span>Auto-sleep after <span class="mono" id="t-min">30</span> min idle</span><span class="switch"><input type="checkbox" id="t-sleep" aria-label="Auto-sleep idle tabs"></span></div>
    <div class="foot">
      <span class="chip chip-ok"><i data-icon="shield-check" data-size="12"></i>Local only · no network</span>
      <span class="row" style="gap:12px"><a href="#" id="open-new" class="mono tiny muted" title="What's new"></a><a href="#" id="open-settings" class="small muted row" style="gap:6px"><i data-icon="settings-2" data-size="14"></i>Settings</a></span>
    </div>
  </footer>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="popup.js"></script>
</body>
</html>
